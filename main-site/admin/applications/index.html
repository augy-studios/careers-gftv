<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="admin.applicationsPageTitle">Dashboard | Careers@GFTV</title>
    <meta name="description" content="Applicant tracking.">
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#ffffff">
    <script>
        (function () {
            var k = "gftv-careers";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode, per gftv-theme.md. Resolved here rather than
            // in theme.js because theme.js runs after first paint, and an
            // evening reader would otherwise watch a white page turn dark.
            // Keep the two hours in step with LIGHT_FROM_HOUR and
            // LIGHT_UNTIL_HOUR in theme.js.
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
                document.documentElement.setAttribute("data-mode-preference", "time");
            }
            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            var l = localStorage.getItem(k + ".locale") || "en";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
            document.documentElement.setAttribute("data-locale", l);
            document.documentElement.setAttribute("lang", l === "zh" ? "zh-Hans-SG" : "en");

            if (l !== "en") {
                document.documentElement.setAttribute("data-i18n-pending", "true");
                setTimeout(function () {
                    document.documentElement.removeAttribute("data-i18n-pending");
                }, 1200);
            }
        })();
    </script>

    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/app.css">

    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://careers.globalfurry.tv/admin/applications">

    <link rel="apple-touch-icon" href="/HLC-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">

    <script type="module" src="/assets/js/shell.js"></script>
    <script type="module" src="/assets/js/admin-applications-page.js"></script>
</head>

<body>
    <div class="boot-loader" aria-hidden="true">
        <span class="spinner delayed"></span>
    </div>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <main class="page page-wide admin" id="main">
        <div class="loading-row" id="adminLoading">
            <span class="spinner delayed"></span>
            <span data-i18n="common.loading">Loading</span>
        </div>

        <div class="admin-layout" id="adminPage" hidden>
            <aside class="admin-sidebar">
                <nav class="admin-nav" id="adminNav"
                     data-i18n-attr="aria-label:admin.navLabel"></nav>
            </aside>

            <div class="admin-content">
                <div class="admin-topbar" id="adminTopbar"></div>

                <p class="callout" id="adminMessage" hidden></p>
                <div class="page-header admin-page-header">
                    <div>
                        <h1 data-i18n="admin.applicationsHeading">Applicant tracking</h1>
                        <p class="lede" data-i18n="admin.applicationsLede">
                            Who was handed over to which form, and where each one
                            has got to. The answers themselves are in Google Forms:
                            each row links out to its posting's response sheet.
                        </p>
                    </div>
                    <button type="button" class="btn btn-quiet" id="exportCsv"
                            data-i18n="admin.exportCsv">Export CSV</button>
                </div>

                <div class="bucket-tabs admin-buckets" id="applicationBuckets" role="tablist"
                     data-i18n-attr="aria-label:admin.bucketsLabel"></div>

                <form class="admin-toolbar" id="applicationFilters" role="search">
                    <div class="field">
                        <label for="filterJob" data-i18n="admin.colRole">Role</label>
                        <select id="filterJob" name="job"></select>
                    </div>
                    <div class="field">
                        <label for="filterFrom" data-i18n="admin.fromDate">From</label>
                        <input id="filterFrom" name="from" type="date">
                    </div>
                    <div class="field">
                        <label for="filterUntil" data-i18n="admin.untilDate">Until</label>
                        <input id="filterUntil" name="until" type="date">
                    </div>
                    <div class="field">
                        <label for="filterQ" data-i18n="admin.searchApplicant">Applicant</label>
                        <input id="filterQ" name="q" type="search" autocomplete="off">
                    </div>
                    <button class="btn btn-secondary" type="submit"
                            data-i18n="search.submit">Search</button>
                    <button class="btn btn-quiet" type="button" data-clear-filters
                            data-i18n="search.clearFilters">Clear filters</button>
                </form>

                <div class="admin-bulk-bar glass-card" id="bulkBar" hidden>
                    <span id="bulkCount"></span>
                    <label class="visually-hidden" for="bulkStatus"
                           data-i18n="admin.bulkChoose">Move to</label>
                    <select id="bulkStatus"></select>
                    <button type="button" class="btn btn-secondary" id="bulkApply"
                            data-i18n="admin.bulkApply">Apply</button>
                    <button type="button" class="btn btn-quiet" id="bulkTask"
                            data-i18n="admin.raiseTask">Raise a task</button>
                </div>

                <div class="admin-list" id="applicationList" aria-busy="true"
                     aria-live="polite"></div>
                <div class="admin-pager" id="applicationPager"></div>
            </div>
        </div>

        <noscript>
            <div class="callout warn">
                <p>This page needs JavaScript.</p>
            </div>
        </noscript>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
