<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="staffAccount.pageTitle">Account settings | Careers@GFTV</title>
    <meta name="description" content="Your password, passkeys, authenticator app, codes, devices and sessions for your Careers@GFTV staff account.">
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#ffffff">
    <script>
        (function () {
            var k = "gftv-careers";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode, per gftv-theme.md. Resolved here instead of
            // in theme.js because theme.js runs after first paint, and an
            // evening reader would otherwise watch a white page turn dark.
            // Keep the two hours in step with LIGHT_FROM_HOUR and
            // LIGHT_UNTIL_HOUR in theme.js.
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
                document.documentElement.setAttribute("data-mode-preference", "time");
            }
            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            var l = localStorage.getItem(k + ".locale") || "en";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
            document.documentElement.setAttribute("data-locale", l);
            document.documentElement.setAttribute("lang", l === "zh" ? "zh-Hans-SG" : "en");

            if (l !== "en") {
                document.documentElement.setAttribute("data-i18n-pending", "true");
                setTimeout(function () {
                    document.documentElement.removeAttribute("data-i18n-pending");
                }, 1200);
            }
        })();
    </script>

    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/app.css">

    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://careers.globalfurry.tv/admin/security">

    <link rel="apple-touch-icon" href="/HLC-180.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">

    <script type="module" src="/assets/js/shell.js"></script>
    <script type="module" src="/assets/js/staff-account.js"></script>
</head>

<body>
    <div class="boot-loader" aria-hidden="true">
        <span class="spinner delayed"></span>
    </div>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <main class="page page-narrow" id="main">
        <!-- **This page is a container and nothing else.** 5f asks for the
             staff account settings suite to be specified once and mounted
             twice, at /admin/security here and at /account on the docs site,
             "from the same markup, the same copy, and the same endpoint
             shapes". Phase 13 decision 8 settled how: assets/js/staff-account.js
             builds every panel, both sites load a generated copy of it, and
             there is no second markup to fall out of step.

             The three attributes are the whole of what this site tells it,
             because they are the only things a stylesheet cannot say.

             **The account URL is the root and not a path.** gftv.asia is a
             one page app with a catch all, so https://gftv.asia/account
             answers 200 and serves the same shell as everything else: a
             reader sent there lands on the wrong view and no check here
             could see it, because the status code is fine. The root is the
             only address in that site's own markup, and a deep link into a
             client routed app is the shape that rots quietly. Found by
             somebody clicking the button, 3 September 2026. -->
        <div id="staffAccount"
             data-signin="/admin/login"
             data-back="/admin"
             data-account-url="https://gftv.asia">
            <div class="loading-row">
                <span class="spinner delayed"></span>
                <span data-i18n="common.loading">Loading</span>
            </div>
        </div>

        <noscript>
            <div class="callout warn">
                <p>This page needs JavaScript.</p>
            </div>
        </noscript>
    </main>

</body>

</html>
