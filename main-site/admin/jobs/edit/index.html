<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="admin.editorPageTitle">Dashboard | Careers@GFTV</title>
    <meta name="description" content="Write a posting.">
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#ffffff">
    <script>
        (function () {
            var k = "gftv-careers";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode, per gftv-theme.md. Resolved here rather than
            // in theme.js because theme.js runs after first paint, and an
            // evening reader would otherwise watch a white page turn dark.
            // Keep the two hours in step with LIGHT_FROM_HOUR and
            // LIGHT_UNTIL_HOUR in theme.js.
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
                document.documentElement.setAttribute("data-mode-preference", "time");
            }
            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            var l = localStorage.getItem(k + ".locale") || "en";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
            document.documentElement.setAttribute("data-locale", l);
            document.documentElement.setAttribute("lang", l === "zh" ? "zh-Hans-SG" : "en");

            if (l !== "en") {
                document.documentElement.setAttribute("data-i18n-pending", "true");
                setTimeout(function () {
                    document.documentElement.removeAttribute("data-i18n-pending");
                }, 1200);
            }
        })();
    </script>

    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/app.css">

    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://careers.globalfurry.tv/admin/jobs/edit">

    <link rel="apple-touch-icon" href="/HLC-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">

    <script type="module" src="/assets/js/shell.js"></script>
    <script type="module" src="/assets/js/admin-job-editor.js"></script>
</head>

<body>
    <div class="boot-loader" aria-hidden="true">
        <span class="spinner delayed"></span>
    </div>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <main class="page page-wide admin" id="main">
        <div class="loading-row" id="adminLoading">
            <span class="spinner delayed"></span>
            <span data-i18n="common.loading">Loading</span>
        </div>

        <div class="admin-layout" id="adminPage" hidden>
            <aside class="admin-sidebar">
                <nav class="admin-nav" id="adminNav"
                     data-i18n-attr="aria-label:admin.navLabel"></nav>
            </aside>

            <div class="admin-content">
                <div class="admin-topbar" id="adminTopbar"></div>

                <p class="callout" id="adminMessage" hidden></p>
                <div class="page-header admin-page-header">
                    <div>
                        <h1 id="editorHeading">New posting</h1>
                        <p class="lede" data-i18n="admin.editorLede">
                            The first tab is the posting itself. Every other tab is
                            that language's translation, and a posting may go out
                            in one language only.
                        </p>
                    </div>
                    <a class="btn btn-quiet" id="editorViewLink" target="_blank" rel="noopener"
                       hidden data-i18n="admin.viewPosting">View posting</a>
                </div>

                <div class="editor-grid">
                    <div class="editor-main glass-card">
                        <div class="lang-tabs" id="editorTabs" role="tablist"
                             data-i18n-attr="aria-label:admin.languageTabsLabel"></div>
                        <div id="editorTabBody"></div>
                        <div class="editor-preview" id="editorPreview" hidden></div>
                    </div>

                    <aside class="editor-side glass-card">
                        <div id="editorShared"></div>
                    </aside>
                </div>

                <div class="editor-actions">
                    <div id="editorPublish"></div>
                    <div class="editor-buttons">
                        <button type="button" class="btn btn-quiet" id="previewButton"
                                data-i18n="admin.preview">Preview</button>
                        <button type="button" class="btn btn-secondary" id="saveButton"
                                data-i18n="admin.save">Save</button>
                        <button type="button" class="btn btn-primary" id="publishButton"
                                data-i18n="admin.publish">Publish</button>
                    </div>
                </div>
            </div>
        </div>

        <noscript>
            <div class="callout warn">
                <p>This page needs JavaScript.</p>
            </div>
        </noscript>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
