<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="tasks.pageTitle">Outstanding tasks | Careers@GFTV</title>
    <meta name="description" content="Anything we need from you, in one place.">
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#ffffff">
    <script>
        (function () {
            var k = "gftv-careers";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode, per gftv-theme.md. Resolved here instead of
            // in theme.js because theme.js runs after first paint, and an
            // evening reader would otherwise watch a white page turn dark.
            // Keep the two hours in step with LIGHT_FROM_HOUR and
            // LIGHT_UNTIL_HOUR in theme.js.
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
                document.documentElement.setAttribute("data-mode-preference", "time");
            }
            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            var l = localStorage.getItem(k + ".locale") || "en";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
            document.documentElement.setAttribute("data-locale", l);
            document.documentElement.setAttribute("lang", l === "zh" ? "zh-Hans-SG" : "en");

            if (l !== "en") {
                document.documentElement.setAttribute("data-i18n-pending", "true");
                setTimeout(function () {
                    document.documentElement.removeAttribute("data-i18n-pending");
                }, 1200);
            }
        })();
    </script>

    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/app.css">

    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://careers.globalfurry.tv/account/tasks">

    <link rel="apple-touch-icon" href="/HLC-180.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">

    <script type="module" src="/assets/js/shell.js"></script>
    <script type="module" src="/assets/js/tasks-page.js"></script>
</head>

<body>
    <div class="boot-loader" aria-hidden="true">
        <span class="spinner delayed"></span>
    </div>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <main class="page account-page" id="main">
        <div class="loading-row" id="accountLoading">
            <span class="spinner delayed"></span>
            <span data-i18n="common.loading">Loading</span>
        </div>

        <div id="accountPage" hidden>
            <div class="page-header account-header">
                <div class="account-identity">
                    <span class="avatar" id="accountAvatar"></span>
                    <span>
                        <h1 data-i18n="tasks.heading">Outstanding tasks</h1>
                        <span class="muted" id="accountUsername"></span>
                    </span>
                </div>
                <p class="lede" data-i18n="tasks.lede">
                    Anything we need from you, in one place. There are no emails
                    on this site, so this page is where a request from the team
                    lands.
                </p>
            </div>

            <nav class="account-nav" id="accountNav"
                 data-i18n-attr="aria-label:account.navLabel"></nav>

            <div class="account-body">
                <p class="callout danger" id="tasksError" role="alert" hidden></p>

                <div class="account-list" id="taskList" aria-busy="true"
                     aria-live="polite"></div>

                <!-- 7g: resolved items collapse under a "recently completed"
                     section instead of vanishing. -->
                <details class="account-done" id="taskDone" hidden>
                    <summary data-i18n="tasks.doneHeading">Recently completed</summary>
                    <div class="account-list" id="taskDoneList"></div>
                </details>

                <div class="empty-state" id="tasksEmpty" hidden>
                    <p data-i18n="tasks.emptyBody">
                        Nothing needs your attention. That is the state this page
                        is meant to be in.
                    </p>
                </div>
            </div>
        </div>

        <noscript>
            <div class="callout warn">
                <p>This page needs JavaScript.</p>
            </div>
        </noscript>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
