<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="saved.pageTitle">Saved roles | Careers@GFTV</title>
    <meta name="description" content="The roles you have saved to come back to.">
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#ffffff">
    <script>
        (function () {
            var k = "gftv-careers";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode, per gftv-theme.md. Resolved here instead of
            // in theme.js because theme.js runs after first paint, and an
            // evening reader would otherwise watch a white page turn dark.
            // Keep the two hours in step with LIGHT_FROM_HOUR and
            // LIGHT_UNTIL_HOUR in theme.js.
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
                document.documentElement.setAttribute("data-mode-preference", "time");
            }
            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            var l = localStorage.getItem(k + ".locale") || "en";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
            document.documentElement.setAttribute("data-locale", l);
            document.documentElement.setAttribute("lang", l === "zh" ? "zh-Hans-SG" : "en");

            if (l !== "en") {
                document.documentElement.setAttribute("data-i18n-pending", "true");
                setTimeout(function () {
                    document.documentElement.removeAttribute("data-i18n-pending");
                }, 1200);
            }
        })();
    </script>

    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/app.css">

    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://careers.globalfurry.tv/account/saved">

    <link rel="apple-touch-icon" href="/HLC-180.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">

    <script type="module" src="/assets/js/shell.js"></script>
    <script type="module" src="/assets/js/saved-page.js"></script>
</head>

<body>
    <div class="boot-loader" aria-hidden="true">
        <span class="spinner delayed"></span>
    </div>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>

    <main class="page account-page" id="main">
        <div class="loading-row" id="accountLoading">
            <span class="spinner delayed"></span>
            <span data-i18n="common.loading">Loading</span>
        </div>

        <div id="accountPage" hidden>
            <div class="page-header account-header">
                <div class="account-identity">
                    <span class="avatar" id="accountAvatar"></span>
                    <span>
                        <h1 data-i18n="saved.heading">Saved roles</h1>
                        <span class="muted" id="accountUsername"></span>
                    </span>
                </div>
                <p class="lede" data-i18n="saved.lede">
                    Roles you kept to come back to, most recently saved first. A
                    role that has since closed stays on the list and says so.
                </p>
            </div>

            <nav class="account-nav" id="accountNav"
                 data-i18n-attr="aria-label:account.navLabel"></nav>

            <div class="account-body">
                <div class="bucket-tabs" id="savedFilters" role="tablist"
                     data-i18n-attr="aria-label:saved.filtersLabel"></div>

                <p class="callout danger" id="savedError" role="alert" hidden></p>

                <div class="account-list" id="savedList" aria-busy="true"
                     aria-live="polite"></div>

                <div class="empty-state" id="savedEmpty" hidden>
                    <p data-i18n="saved.emptyBody">
                        You have not saved any roles yet. The bookmark on a role
                        keeps it here.
                    </p>
                    <p>
                        <a class="btn btn-primary" href="/search"
                           data-i18n="account.browseRoles">Browse open roles</a>
                    </p>
                </div>
            </div>
        </div>

        <noscript>
            <div class="callout warn">
                <p>This page needs JavaScript.</p>
            </div>
        </noscript>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
