<!doctype html>
<html lang="en">

<head>
    <!-- The shell. One document, both pipelines, per 16e: "the two pipelines
         share one layout, one sidebar component, one table of contents, and one
         stylesheet. A reader must not be able to tell which pipeline a page came
         from."

         At runtime it is what every address that is not a static file and not an
         API route resolves to, through the rewrite in vercel.json. It reads its
         own path, asks /api/content for that page, and renders it.

         At build time, part 5 reads this same file, fills the article with the
         page's HTML and marks it data-prerendered, and writes the result out as
         a static file for each public page. Vercel matches the filesystem before
         it consults rewrites, so those files win over the rewrite by themselves
         and nothing here has to change when they arrive.

         There is deliberately no second copy of this markup anywhere. -->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="shell.title">Careers@GFTV documentation</title>
    <meta name="description" data-i18n-attr="content:shell.description"
        content="Guides to the Careers@GFTV job portal and its Telegram bot.">

    <!-- Theme, before the stylesheet, so both axes exist on <html> before any
         colour block is evaluated. The portal's head carries the same script and
         it is deliberately not shared: it cannot import anything, it has to run
         before first paint, and a fetched copy would defeat the point of it.
         Keep the keys in step with APP_KEY in /assets/js/theme.js.

         It holds the page blank while a non default dictionary loads, which is
         the portal's own rule and arrived here with part 6a: until then this
         site had one dictionary and holding a page blank waiting for the file
         that is already the fallback would have been a blank page for no
         reason. -->
    <meta name="theme-color" content="#ffffff">
    <script>
        (function () {
            var k = "gftv-careers";
            var m = localStorage.getItem(k + ".mode") || "light";

            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
                document.documentElement.setAttribute("data-mode-preference", "time");
            }

            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute(
                "data-color-theme",
                localStorage.getItem(k + ".colorTheme") || "classic"
            );

            // **This read the string "en" until phase 13 part 6a**, which was
            // right while the site had one dictionary and is not any more.
            // Without it a 华文 reader gets a page tagged as English and a
            // flash of English copy before i18n.js has fetched anything.
            var l = localStorage.getItem(k + ".locale") || "en";
            document.documentElement.setAttribute("data-locale", l);
            document.documentElement.setAttribute("lang", l === "zh" ? "zh-Hans-SG" : "en");

            // The page is held blank until the dictionary applies, which is the
            // portal's rule from the multilingual change set and exists because
            // the alternative is every reader watching the English redraw. The
            // timeout is the release valve: a dictionary that never arrives
            // must not leave somebody looking at nothing.
            if (l !== "en") {
                document.documentElement.setAttribute("data-i18n-pending", "true");
                setTimeout(function () {
                    document.documentElement.removeAttribute("data-i18n-pending");
                }, 1200);
            }
        })();
    </script>

    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/docs.css">

    <!-- The icons and the link card, phase 14 part 2b. Until then this site had
         neither, so a tab showed the browser's blank page icon and a link to a
         guide previewed as a title and nothing else, while the portal's card
         carried the GFTV mark.

         **None of it is translated, and that is not an oversight.** Nothing that
         reads these runs the page: a scraper takes the markup as it was served,
         so a `data-i18n-attr` here would leave every card in the fallback
         language whatever the reader had chosen. The description above is
         translated because a browser does read that one, and the two saying the
         same thing twice is the price of the two being read by different things.

         The origin is written out rather than assembled, exactly as the portal's
         head writes its own. **The canonical link is the one copy of it**: the
         build reads the origin back off this line to write each page's own
         address, so a move needs this line changed and nothing else. -->
    <link rel="canonical" href="https://docs.careers.globalfurry.tv/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Careers@GFTV docs">
    <meta property="og:title" content="Careers@GFTV documentation">
    <meta property="og:description" content="Guides to the Careers@GFTV job portal and its Telegram bot.">
    <meta property="og:url" content="https://docs.careers.globalfurry.tv/">
    <meta property="og:image" content="/HLC-main.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/HLC-main.png">

    <!-- Generated into public/ by gen-docs-lib.js from the portal's own copies,
         so one GFTV has one mark on both tabs. -->
    <link rel="apple-touch-icon" href="/HLC-180.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
</head>

<body class="docs-shell">
    <a class="docs-skip" href="#docsMain" data-i18n="shell.skipToContent">Skip to the content</a>

    <header class="docs-header">
        <button type="button" class="docs-btn docs-btn-quiet docs-menu-btn" id="docsMenu"
            aria-expanded="false" aria-controls="docsSidebar"></button>

        <a class="docs-brand" href="/" data-i18n="shell.siteName">Careers@GFTV docs</a>

        <!-- Search stays in the header at every width and never goes inside the
             hamburger: it is how people navigate documentation on a phone. -->
        <div class="docs-search">
            <input type="search" id="docsSearch" autocomplete="off" role="combobox"
                aria-expanded="false" aria-controls="docsSearchResults" aria-autocomplete="list"
                data-i18n-attr="placeholder:search.placeholder,aria-label:search.label">
            <div class="docs-search-results" id="docsSearchResults" role="listbox" hidden
                data-i18n-attr="aria-label:search.results"></div>
        </div>

        <div class="docs-header-actions">
            <!-- Below 640px this is hidden and the sidebar panel carries it
                 instead. Search and the account control never move. -->
            <a class="docs-btn docs-portal-link" href="https://careers.globalfurry.tv"
                data-i18n="header.portal" data-i18n-attr="title:header.portalLabel">The portal</a>

            <!-- The language and theme controls, phase 14 part 1.

                 **They were a bare <select> and a button reading "Light" until
                 then**, which was this site applying gftv-theme.md as a token
                 contract and not as the chrome it also specifies. That file's
                 section 3 is markup: it prescribes the modal, the two sections
                 inside it, and an .icon-btn to open it, and its acceptance
                 checklist asks about the theme button's icon. So both controls
                 are now the portal's own modals, generated in by gen-docs-lib.js
                 as assets/js/chrome-modals.js -- one implementation of a control
                 the theme file writes out exactly, and not a second one in this
                 site's dialect.

                 **The ids are the portal's**, which is what lets that module
                 come across with no transform rule: it finds its own opener with
                 document.querySelector('#themeButton').

                 **Both keep their place at every width**, like search and the
                 account control and for the reason 16d gives about those: a
                 reader who cannot find how to change the language concludes
                 there is nothing to change.

                 The theme control carries both axes, which overrules 16d's "the
                 light and dark toggle". The hello palette has been generated
                 into this site since part 4 and measured in all four
                 combinations by part 7; it was paid for and unreachable, and
                 this is the control that reaches it. -->
            <button type="button" class="icon-btn" id="languageButton"
                aria-haspopup="dialog" data-i18n-attr="aria-label:common.language">
                <span data-icon="globe" data-icon-size="22"></span>
            </button>

            <button type="button" class="icon-btn" id="themeButton"
                aria-haspopup="dialog" data-i18n-attr="aria-label:common.appearance">
                <span data-icon="palette" data-icon-size="22"></span>
            </button>

            <!-- The account control keeps its place at every width too, for the
                 reason 16d gives: a reader who cannot find how to sign out
                 assumes they have not. -->
            <div class="docs-account" id="docsAccount"></div>
        </div>
    </header>

    <div class="docs-layout">
        <nav class="docs-sidebar" id="docsSidebar" data-i18n-attr="aria-label:nav.sidebar"></nav>

        <main class="docs-main" id="docsMain" tabindex="-1">
            <nav class="docs-breadcrumbs" id="docsBreadcrumbs"></nav>

            <!-- Below 1024px the contents column drops to this collapsible block
                 above the content. The same list, and only one of the two is
                 ever on screen. -->
            <details class="docs-toc-inline" id="docsTocInline" hidden></details>

            <article class="docs-article" id="docsArticle"></article>

            <!-- 16e: every page carries a last updated date taken from git. It
                 is outside the article because it is a fact about the file and
                 not a line of it, and it is hidden until there is one: a page
                 the build could not date says nothing rather than guessing. -->
            <p class="docs-updated" id="docsUpdated" hidden></p>

            <nav class="docs-pager" id="docsPager" hidden></nav>
        </main>

        <aside class="docs-toc" id="docsToc" data-i18n-attr="aria-label:nav.contents"></aside>
    </div>

    <script type="module" src="/assets/js/shell.js"></script>
</body>

</html>
